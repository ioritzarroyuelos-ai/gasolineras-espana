name: Retirar respaldo de preview

# pull_request no se ejecuta si hay conflictos. Este evento usa el workflow
# de main y nunca descarga ni ejecuta archivos de la propuesta cerrada.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Comparte grupo con preview: cerrar cancela el despliegue aún pendiente;
# reabrir cancela la retirada y permite volver a desplegar el respaldo.
concurrency:
  group: deploy-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-guardias-preview:
    name: Retirar respaldo temporal del PR cerrado
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >-
      github.repository == 'ioritzarroyuelos-ai/gasolineras-espana' &&
      github.event.action == 'closed' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Eliminar únicamente el respaldo de este PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { PR_NUMBER, GITHUB_REPOSITORY, GH_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN } = process.env
          if (GITHUB_REPOSITORY !== 'ioritzarroyuelos-ai/gasolineras-espana' || !/^[1-9][0-9]*$/.test(PR_NUMBER || '') || !/^[a-f0-9]{32}$/.test(CLOUDFLARE_ACCOUNT_ID || '') || !GH_TOKEN || !CLOUDFLARE_API_TOKEN) throw Error('Configuración de limpieza inválida')
          // Comprueba de nuevo el estado por si se ha reabierto mientras esperaba.
          const prResponse = await fetch('https://api.github.com/repos/' + GITHUB_REPOSITORY + '/pulls/' + PR_NUMBER, {
            headers: { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(20000),
          })
          if (!prResponse.ok) throw Error('No se pudo comprobar el cierre del PR (HTTP ' + prResponse.status + ')')
          const pr = await prResponse.json()
          if (pr.state !== 'closed') { console.log('PR reabierto: se conserva el respaldo temporal'); process.exit(0) }
          if (pr.number !== Number(PR_NUMBER) || pr.base?.ref !== 'main' || pr.base?.repo?.full_name !== GITHUB_REPOSITORY || pr.head?.repo?.full_name !== GITHUB_REPOSITORY) throw Error('El PR no corresponde a este repositorio y rama')
          const name = 'espana-util-guardias-pr-' + PR_NUMBER
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/' + name + '?force=false', {
            method: 'DELETE', headers: { Authorization: 'Bearer ' + CLOUDFLARE_API_TOKEN }, signal: AbortSignal.timeout(20000),
          })
          // Cloudflare puede contestar 204 sin cuerpo. Un error de permisos o
          // dependencias debe fallar; sólo se admite un Worker ya inexistente.
          const body = await response.text()
          const result = body ? JSON.parse(body) : null
          const absent = response.status === 404 && result?.errors?.length > 0 && result.errors.every(e => e.code === 10007)
          if (!(response.ok && result?.success !== false) && !absent) throw Error('No se pudo retirar el respaldo temporal (HTTP ' + response.status + ')')
          console.log('Respaldo temporal retirado o ya ausente: ' + name)
          NODE
