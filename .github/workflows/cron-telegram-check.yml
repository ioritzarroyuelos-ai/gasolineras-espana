name: Telegram cron — avisos de precios elegidos (mañana España)
run-name: "Telegram · ${{ inputs.dry_run && 'comprobación sin envío' || 'resumen diario' }}"

# El coordinador independiente dispara dentro de 08:00–11:59 Europe/Madrid.
# Un disparo manual conserva la guarda horaria y la protección contra duplicados.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Comprobar datos y suscripciones sin enviar ni modificar nada
        type: boolean
        default: false
      automatic:
        description: Disparo del coordinador automático
        type: boolean
        default: false

concurrency:
  group: cron-telegram-check
  cancel-in-progress: false

jobs:
  telegram-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Comprobar o enviar los avisos elegidos sin forzar duplicados
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/run-telegram-digest.mjs
