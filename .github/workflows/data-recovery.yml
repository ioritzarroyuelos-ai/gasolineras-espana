name: Recuperar actualizaciones pendientes
on:
  schedule:
    - cron: '43 */4 * * *'
  workflow_dispatch:
concurrency:
  group: data-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Comprobar producción y recuperar trabajos pendientes sin duplicarlos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/recover-data.mjs
