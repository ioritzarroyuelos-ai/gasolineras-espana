name: Coordinar actualizaciones de datos
on:
  repository_dispatch:
    types: [data-clock-v1]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
concurrency:
  group: data-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      github.repository == 'ioritzarroyuelos-ai/gasolineras-espana' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'repository_dispatch' ||
      (github.event.sender.id == 352320937 && github.event.sender.login == 'espanautildatos-ioritzarroyuelos[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Comprobar cadencias, producción y trabajos pendientes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_APP_CLIENT_ID: ${{ vars.DATA_APP_CLIENT_ID }}
        run: node scripts/recover-data.mjs
