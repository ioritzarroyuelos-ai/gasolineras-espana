name: Dependabot auto-merge

# Sólo actualizaciones patch/minor; las major siempre requieren revisión.
# pull_request_target permite usar la App sin entregar secretos al código del PR:
# sólo se descarga el commit BASE de main y se lee la metadata por la API.
# No se instala ni ejecuta nada de la rama propuesta.
# La App mantiene el flujo de push a main → CI → Deploy; GITHUB_TOKEN no dispara
# ese nuevo workflow. --auto sigue esperando todos los checks de la protección.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.repository == 'ioritzarroyuelos-ai/gasolineras-espana' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer únicamente el código de la base protegida
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Leer y validar metadata de Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3, Node 24
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-verification: false
          skip-commit-verification: false

      - name: Crear identidad temporal sólo para actualizaciones compatibles
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        id: dependency-token
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - name: Esperar las pruebas obligatorias y activar la incorporación automática
        if: steps.dependency-token.outcome == 'success'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ steps.dependency-token.outputs.token }}
        run: gh pr merge --auto --squash --match-head-commit "$PR_SHA" "$PR_URL"
