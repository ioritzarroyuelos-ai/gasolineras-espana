name: Fetch EV chargers snapshot

# Refresca public/data/chargers.json a diario desde el registro OFICIAL del
# MITERD publicado por la DGT (DATEX2 v3, nacional, CC BY, actualizado cada
# 24h). Si existe el secreto OCM_API_KEY, completa con Open Charge Map
# (comunidad, CC BY-SA) los puntos que no esten en el registro oficial.
#
# Se puede disparar manual con workflow_dispatch para un refresh urgente.
#
# El registro oficial se publica a diario, asi que corremos a diario para no
# quedarnos con altas/bajas de estaciones desfasadas.

on:
  schedule:
    # 05:15 UTC = 06:15/07:15 Madrid. Hora baja de trafico para no interferir
    # con el cron de precios (07:00 y 19:00 UTC).
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy a Pages aunque no haya cambios en el snapshot'
        type: boolean
        default: false

concurrency:
  group: fetch-chargers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch snapshot de electrolineras (DGT/MITERD + OCM opcional)
        env:
          # Opcional: si está definido en los secrets del repo, completa el
          # registro oficial con Open Charge Map. Sin él, snapshot 100% oficial.
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: node scripts/fetch-chargers.mjs

      - name: Commit snapshot si hay cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/chargers.json
          if git diff --cached --quiet; then
            echo "Sin cambios en chargers.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): actualizar snapshot de recargadores $(date -u +%Y-%m-%dT%H:%MZ)"
            # Push resistente a carreras con otros robots (ver fetch-prices.yml):
            # fusiona lo remoto con -X ours y reintenta para que un rechazo por
            # "fetch first" no tumbe el job y salte el deploy.
            pushed=0
            for i in 1 2 3; do
              git fetch origin main || true
              if git merge -X ours --no-edit origin/main && git push; then pushed=1; break; fi
              echo "push intento $i fallo; reintento en 5s"
              git merge --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "::error::no se pudo pushear el snapshot de recargadores tras 3 intentos"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Auto-deploy si cambia el snapshot (mismo patron que fetch-prices.yml).
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verificar que los secrets existen
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN no configurado — snapshot en repo pero no llega a prod hasta deploy manual."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        if: steps.secrets.outputs.present == 'true'
        run: npm ci

      - name: Build bundle
        if: steps.secrets.outputs.present == 'true'
        run: npm run build

      - name: Deploy a Cloudflare Pages
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=webapp \
            --branch=main \
            --commit-dirty=true \
            --commit-message="auto-deploy: chargers refresh $(date -u +%Y-%m-%dT%H:%MZ)"
