name: Fetch EV chargers snapshot

# Refresca public/data/chargers.json a diario desde el registro OFICIAL del
# MITERD publicado por la DGT (DATEX2 v3, nacional, CC BY, actualizado cada
# 24h). Si existe el secreto OCM_API_KEY, completa con Open Charge Map
# (comunidad, CC BY-SA) los puntos que no esten en el registro oficial.
#
# Se puede disparar manual con workflow_dispatch para un refresh urgente.
#
# El registro oficial se publica a diario, asi que corremos a diario para no
# quedarnos con altas/bajas de estaciones desfasadas.

on:
  schedule:
    # 05:15 UTC = 06:15/07:15 Madrid. Hora baja de trafico para no interferir
    # con el cron de precios (07:00 y 19:00 UTC).
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy a Pages aunque no haya cambios en el snapshot'
        type: boolean
        default: false

concurrency:
  group: fetch-chargers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch snapshot de electrolineras (DGT/MITERD + OCM opcional)
        env:
          # Opcional: si está definido en los secrets del repo, completa el
          # registro oficial con Open Charge Map. Sin él, snapshot 100% oficial.
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: node scripts/fetch-chargers.mjs

      - name: Publicar datos mediante PR validado
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add public/data/chargers.json
          node scripts/publish-data.mjs chargers
