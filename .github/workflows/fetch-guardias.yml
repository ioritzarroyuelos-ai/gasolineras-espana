name: Fetch guardias farmacias snapshot

# v1.28 — Refresca los snapshots de farmacias de guardia A DIARIO
# desde 47 fuentes (45 COF provinciales + SESCAM regional para CLM + Ayto
# La Bañeza para León):
#   - Madrid     (cofm.es)                  → guardias-madrid.json
#   - Bizkaia    (cofbizkaia.net)           → guardias-bizkaia.json
#   - Gipuzkoa   (cofgipuzkoa.pretools.net) → guardias-gipuzkoa.json
#   - Araba      (cofalava.org)             → guardias-alava.json
#   - A Coruña   (cofc.es)                  → guardias-coruna.json
#   - Murcia     (guardias.cofrm.com API)   → guardias-murcia.json
#   - Almería    (cofalmeria.com)           → guardias-almeria.json
#   - Girona     (cofgi.org)                → guardias-girona.json
#   - Tarragona  (coft.cat)                 → guardias-tarragona.json
#   - Córdoba    (cofco.org)                → guardias-cordoba.json
#   - Cantabria  (cofcantabria.org API)     → guardias-cantabria.json
#   - Pontevedra (cofpo.org API)            → guardias-pontevedra.json
#   - Las Palmas (coflaspalmas.es API)      → guardias-laspalmas.json
#   - Alicante   (cofalicante.com REST API) → guardias-alicante.json
#   - Cádiz      (cofcadiz.es vcomm API)    → guardias-cadiz.json
#   - Ceuta      (cofceuta.com vcomm API)   → guardias-ceuta.json
#   - Valencia   (micof.es portal MICOF)    → guardias-valencia.json
#   - CLM        (sescam.jccm.es backend)   → guardias-clm.json
#                (Albacete + Ciudad Real + Cuenca + Guadalajara + Toledo)
#   - Ourense    (cofourense vcomm API)     → guardias-ourense.json
#   - Huesca     (cofhuesca.com)            → guardias-huesca.json
#   - Barcelona  (farmaguia.net)            → guardias-barcelona.json
#   - Baleares   (cofib.es ASMX SOAP)       → guardias-baleares.json
#   - Navarra    (datosabiertos.navarra)    → guardias-navarra.json
#   - Castellón  (cofcastellon JSP)         → guardias-castellon.json
#   - Asturias   (farmasturias.org)         → guardias-asturias.json
#   - Rioja      (riojasalud.es)            → guardias-rioja.json
#   - Cáceres    (cofcaceres Laravel)       → guardias-caceres.json
#   - Lleida     (coflleida.cat ASP)        → guardias-lleida.json
#   - Soria      (cofsoria.es)              → guardias-soria.json
#   - Zamora     (cofzamora.es)             → guardias-zamora.json
#   - Málaga     (CGCOF id=29)              → guardias-malaga.json
#   - Zaragoza   (CGCOF id=50)              → guardias-zaragoza.json
#   - Badajoz    (CGCOF id=06)              → guardias-badajoz.json
#   - Valladolid (cofvalladolid.es markers)  → guardias-valladolid.json
#   - Melilla    (CGCOF id=52)              → guardias-melilla.json
#   - Ávila      (CGCOF id=05)              → guardias-avila.json
#   - Burgos     (CGCOF id=09)              → guardias-burgos.json
#   - Salamanca  (CGCOF id=37)              → guardias-salamanca.json
#   - Tenerife   (coftenerife.es API JSON)  → guardias-tenerife.json
#                (Tenerife + La Palma + La Gomera + El Hierro)
#   - Teruel     (cofteruel.org listado)    → guardias-teruel.json
#   - Segovia    (cofsegovia.com PDF anual) → guardias-segovia.json
#   - Granada    (cofgranada.com PDF AJAX)  → guardias-granada.json
#   - Palencia   (cofpalencia.org PDF semanal) → guardias-palencia.json
#   - Huelva     (cofhuelva.org PDF + localizador) → guardias-huelva.json
#   - Jaén       (farmaceuticosdejaen.es PDF mensual) → guardias-jaen.json
#   - Sevilla    (farmaceuticosdesevilla.es PDFs trimestrales) → guardias-sevilla.json
#                (cobertura: Aljarafe + Sevilla capital + Alcalá Guadaira +
#                Morón-Osuna-Estepa + Sierra Norte + 5 zonas via OCR
#                (alcaladelrio, brenes, burguillos, cantillana, carmona))
#   - León       (aytobaneza.es PDF policia local)             → guardias-leon.json
#                (cobertura: SOLO La Bañeza ~10k hab. cofleon.es SOAP caido
#                sin alternativa para capital ni Ponferrada — La Bañeza es
#                la unica fuente publica verificada en la provincia)
#
# Provincias parcialmente bloqueadas:
#   - León: cofleon.es backend SOAP permanentemente caido. La Bañeza cubierta
#     via PDF del Ayuntamiento (Policia Local). Capital y Ponferrada sin
#     alternativa publica — todas las pistas (SACYL, JCyL, CGCOF, ayuntos)
#     redirigen al cofleon.es caido.
#
# Provincias totalmente bloqueadas:
#   - Lugo (coflugo.org): protegido con reCAPTCHA v3 (action=farmacia_guardia,
#     site key 6LfwyCMiAAAAAJ_gBJDwXxd-gwifxEQU45M4lQEJ). Validacion del
#     token server-side: POST sin token → resultado vacio. CGCOF redirige
#     al mismo dominio. SERGAS y paxinasgalegas no exponen guardias en
#     vivo. Sin alternativa publica.
#
# Sevilla — 5 zonas via OCR:
#   - alcaladelrio, brenes, burguillos, cantillana, carmona: PDFs escaneados
#     (sin capa de texto). Pipeline: pdfjs-dist render -> @napi-rs/canvas
#     PNG -> tesseract.js OCR (idioma spa) -> regex pares Dia+Noche -> indice
#     por dia desde el 1 del trimestre. Cache por hash de PDF en
#     scripts/cache/sevilla-ocr/ y actions/cache por trimestre. Tiempo: 9
#     min primer run del trimestre, ~6s en runs posteriores cuando el cache
#     hit (PDF no cambio).
#
# Cobertura efectiva: 49 de 50 provincias (con León parcial) + Ceuta + Melilla
# = 51 de 52 territorios (98%). El unico hueco completo es Lugo (reCAPTCHA
# server-side). Leon parcial cubre solo La Bañeza, sin capital ni Ponferrada.
#
# Por que semanal y no diario:
#   Los COF actualizan las guardias cada dia (cada provincia tiene un calendario
#   distinto), pero el caso de uso tipico del usuario es "las de esta semana".
#   Un usuario espanol hace mapa mental de guardias SEMANAL, no diario. Con un
#   refresh semanal vemos las de lunes cuando el cron corre, y sirve toda la
#   semana. Si en el futuro queremos frecuencia diaria cambiamos el cron sin
#   tocar los scrapers.
#
# Tolerancia a fallos:
#   Los scrapers corren en serie pero son independientes — si uno falla los
#   otros pueden haber commiteado con exito. Cada scraper tiene umbrales
#   defensivos propios: si la API cambia o devuelve algo raro, exit 1 sin
#   sobrescribir el JSON existente.

on:
  schedule:
    # Todos los dias a las 05:45 UTC = 06:45/07:45 Madrid. Justo despues de los
    # otros crons (prices 05:00, guardias algo mas tarde para no solapar).
    # Diario, no semanal: muchos colegios rotan la guardia cada dia, asi que el
    # turno solo es "de hoy" si se captura hoy. Los territorios que fallen se
    # avisan por Telegram (guardias-monitor) y la web oculta su turno viejo
    # (frescuraGuardia en src/lib/guardias.ts).
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      solo_avila:
        description: Volver a consultar solo el listado nocturno de Ávila
        type: boolean
        default: false
        required: false
      solo_valencia_tenerife:
        description: Volver a consultar solo Valencia y Tenerife
        type: boolean
        default: false
        required: false
      solo_almeria:
        description: Volver a consultar solo Almería
        type: boolean
        default: false
        required: false

concurrency:
  group: fetch-guardias
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Instala dependencias ANTES de los scrapers. Sin esto, los scrapers que
      # importan paquetes (pdf-parse en granada/huelva/jaen/leon/palencia/
      # segovia/sevilla, pdfjs-dist en jaen) fallaban con ERR_MODULE_NOT_FOUND
      # y sus territorios quedaban sin refrescar (aviso de caducado en la web).
      - name: Validar selección manual
        if: (inputs.solo_avila && inputs.solo_almeria) || (inputs.solo_valencia_tenerife && (inputs.solo_avila || inputs.solo_almeria))
        run: |
          echo "::error::Selecciona solo una opción para la consulta dirigida."
          exit 1

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # Los scrapers se ejecutan en serie para que un fallo de uno no
      # bloquee a los otros. `continue-on-error` + `if: always()` en el step
      # de commit hace que commiteemos lo que tengamos aunque alguno falle.
      - name: Guardias Madrid (COFM)
        id: madrid
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        run: node scripts/fetch-guardias-madrid.mjs

      - name: Guardias Bizkaia (COF Bizkaia)
        id: bizkaia
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        run: node scripts/fetch-guardias-bizkaia.mjs

      - name: Guardias Gipuzkoa (COF Gipuzkoa)
        id: gipuzkoa
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/fetch-guardias-gipuzkoa.mjs

      - name: Guardias Araba (COF Alava)
        id: alava
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        run: node scripts/fetch-guardias-alava.mjs

      - name: Guardias A Coruña (COF A Coruña)
        id: coruna
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        run: node scripts/fetch-guardias-coruna.mjs

      - name: Guardias Murcia (COF Region de Murcia)
        id: murcia
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        run: node scripts/fetch-guardias-murcia.mjs

      - name: Guardias Almeria (COF Almeria)
        id: almeria
        if: inputs.solo_avila != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/fetch-guardias-almeria.mjs

      - name: Guardias Girona (COF Girona)
        id: girona
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/fetch-guardias-girona.mjs

      - name: Guardias Tarragona (COF Tarragona)
        id: tarragona
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/fetch-guardias-tarragona.mjs

      - name: Guardias Córdoba (COF Córdoba)
        id: cordoba
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 6
        run: node scripts/fetch-guardias-cordoba.mjs

      - name: Guardias Cantabria (COF Cantabria API REST)
        id: cantabria
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-guardias-cantabria.mjs

      - name: Guardias Pontevedra (COF Pontevedra API)
        id: pontevedra
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-guardias-pontevedra.mjs

      - name: Guardias Las Palmas (COF Las Palmas API WordPress)
        id: laspalmas
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-guardias-laspalmas.mjs

      - name: Guardias Alicante (COF Alicante REST API)
        id: alicante
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/fetch-guardias-alicante.mjs

      - name: Guardias Cádiz (COF Cádiz vcomm API)
        id: cadiz
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-guardias-cadiz.mjs

      - name: Guardias Ceuta (COF Ceuta vcomm API)
        id: ceuta
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-guardias-ceuta.mjs

      - name: Guardias Valencia (MICOF portal HTML)
        id: valencia
        if: inputs.solo_avila != true && inputs.solo_almeria != true
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/fetch-guardias-valencia.mjs

      - name: Guardias Castilla-La Mancha (SESCAM backend)
        id: clm
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/fetch-guardias-clm.mjs

      - name: Guardias Ourense (COF Ourense vcomm API)
        id: ourense
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/fetch-guardias-ourense.mjs

      - name: Guardias Huesca (COF Huesca)
        id: huesca
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Geocodifica con Nominatim (~30 farmacias). Estimado ~1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-huesca.mjs

      - name: Guardias Barcelona (farmaguia.net)
        id: barcelona
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Coords nativas en HTML. Estimado <1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-barcelona.mjs

      - name: Guardias Baleares (COFIB ASMX)
        id: baleares
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # SOAP con coords nativas. <30s.
        timeout-minutes: 3
        run: node scripts/fetch-guardias-baleares.mjs

      - name: Guardias Navarra (Datos Abiertos CKAN)
        id: navarra
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CKAN datastore JSON con coords. <30s.
        timeout-minutes: 3
        run: node scripts/fetch-guardias-navarra.mjs

      - name: Guardias Castellón (COF Castellón JSP)
        id: castellon
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # JSP + JSESSIONID. Geocoding Nominatim. ~2 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-castellon.mjs

      - name: Guardias Asturias (farmasturias.org)
        id: asturias
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Geocoding Nominatim ~70 farmacias. ~2 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-asturias.mjs

      - name: Guardias Rioja (riojasalud.es)
        id: rioja
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Geocoding Nominatim ~10 farmacias. ~1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-rioja.mjs

      - name: Guardias Cáceres (COF Cáceres Laravel)
        id: caceres
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CSRF + sesion. Geocoding Nominatim. ~2 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-caceres.mjs

      - name: Guardias Lleida (COF Lleida ASP)
        id: lleida
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # ASP IIS + iteracion 16 iniciales. Coords nativas. ~3 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-lleida.mjs

      - name: Guardias Soria (cofsoria.es)
        id: soria
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Coords nativas en L.map.setView. <1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-soria.mjs

      - name: Guardias Zamora (cofzamora.es)
        id: zamora
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Tabla home + Nominatim. ~1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-zamora.mjs

      - name: Guardias Málaga (CGCOF id=29)
        id: malaga
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CGCOF + Nominatim ~50 farmacias. ~3 min.
        timeout-minutes: 10
        run: node scripts/fetch-guardias-malaga.mjs

      - name: Guardias Zaragoza (CGCOF id=50)
        id: zaragoza
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CGCOF + Nominatim ~95 farmacias. ~5 min con back-off.
        timeout-minutes: 15
        run: node scripts/fetch-guardias-zaragoza.mjs

      - name: Guardias Badajoz (CGCOF id=06)
        id: badajoz
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CGCOF + Nominatim ~70 farmacias. ~3 min.
        timeout-minutes: 10
        run: node scripts/fetch-guardias-badajoz.mjs

      - name: Guardias Valladolid (COF Valladolid markers JS)
        id: valladolid
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # HTML expone markers JS con lat/lng pre-geocodificadas. <30s.
        timeout-minutes: 3
        run: node scripts/fetch-guardias-valladolid.mjs

      - name: Guardias Melilla (CGCOF id=52)
        id: melilla
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CGCOF — 1 zona, 2-3 farmacias guardia. <1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-melilla.mjs

      - name: Guardias Ávila (COF Ávila, listado nocturno)
        id: avila
        if: inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Listado oficial fechado de hoy o ayer, siempre sin inferir apertura.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-avila.mjs

      - name: Guardias Burgos (CGCOF id=09)
        id: burgos
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CGCOF — 25 zonas. ~16 farmacias guardia. Geocoding Nominatim. ~3 min.
        timeout-minutes: 10
        run: node scripts/fetch-guardias-burgos.mjs

      - name: Guardias Salamanca (CGCOF id=37)
        id: salamanca
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # CGCOF — 17 zonas. ~13 farmacias guardia. Geocoding Nominatim. ~2 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-salamanca.mjs

      - name: Guardias Tenerife (COF Tenerife API JSON)
        id: tenerife
        if: inputs.solo_avila != true && inputs.solo_almeria != true
        continue-on-error: true
        # API JSON con coords nativas. 53 municipios x 1 GET. ~1 min.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-tenerife.mjs

      - name: Guardias Teruel (COF Teruel listado HTML)
        id: teruel
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # Listado WP + ficha por slug + Nominatim. ~20 farmacias. ~2 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-teruel.mjs

      - name: Guardias Segovia (COF Segovia PDF anual capital)
        id: segovia
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # PDF anual capital + Nominatim. 2 farmacias/dia (diurna+nocturna). ~30s.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-segovia.mjs

      - name: Guardias Granada (COF Granada PDF AJAX capital)
        id: granada
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # AJAX → PDF + parser DIURNO/NOCTURNO + Nominatim. ~30 farmacias. ~2 min.
        timeout-minutes: 8
        run: node scripts/fetch-guardias-granada.mjs

      - name: Guardias Palencia (COF Palencia PDF semanal capital)
        id: palencia
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # HTML menu → PDF semanal + parser por dia + Nominatim. 3 farmacias/dia.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-palencia.mjs

      - name: Guardias Huelva (COF Huelva PDF mensual + localizador)
        id: huelva
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # PDF mensual con FARMACIAS 24H + match con localizador (lat/lng nativos).
        timeout-minutes: 5
        run: node scripts/fetch-guardias-huelva.mjs

      - name: Guardias Jaén (COF Jaén PDF mensual capital)
        id: jaen
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # PDF mensual capital + parser por dia + Nominatim. 5 farmacias/dia (3 diurnas + 2 nocturnas).
        timeout-minutes: 5
        run: node scripts/fetch-guardias-jaen.mjs

      # Calcular trimestre y año actuales (UTC) para cachear el OCR Sevilla
      # con clave estable durante el trimestre.
      - name: Calcular trimestre actual
        id: fecha
        run: |
          year=$(date -u +%Y)
          mes=$(date -u +%m)
          trimestre=$(( (10#$mes - 1) / 3 + 1 ))
          echo "year=$year" >> "$GITHUB_OUTPUT"
          echo "trimestre=$trimestre" >> "$GITHUB_OUTPUT"

      # Cache del texto OCR de los 5 PDFs escaneados (alcaladelrio, brenes,
      # burguillos, cantillana, carmona). Key = trimestre actual: cuando
      # cambia el trimestre el cache se invalida y se re-OCR. Esto evita los
      # ~9 min/run de OCR cuando el PDF no cambio entre semanas.
      - name: Cache OCR Sevilla
        uses: actions/cache@v4
        with:
          path: scripts/cache/sevilla-ocr
          key: sevilla-ocr-${{ steps.fecha.outputs.year }}-T${{ steps.fecha.outputs.trimestre }}
          restore-keys: |
            sevilla-ocr-

      - name: Guardias Sevilla (COF Sevilla 9 PDFs trimestrales por zona)
        id: sevilla
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # 9 PDFs trimestrales (Aljarafe + 8 zonas). 4 texto + Sevilla capital +
        # alcaladeguadaira texto + 5 zonas escaneadas con pipeline OCR
        # (tesseract.js + @napi-rs/canvas). Cache OCR por trimestre = 9 min
        # primer run del trimestre, luego ~6s. ~190 farmacias en ~72 municipios.
        timeout-minutes: 25
        run: node scripts/fetch-guardias-sevilla.mjs

      - name: Guardias León (Ayto La Bañeza PDF policia local)
        id: leon
        if: inputs.solo_avila != true && inputs.solo_almeria != true && inputs.solo_valencia_tenerife != true
        continue-on-error: true
        # PDF anual del Ayto de La Bañeza con calendario de guardias rotando entre
        # 5 farmacias. Cobertura SOLO La Bañeza — capital y Ponferrada sin fuente.
        timeout-minutes: 5
        run: node scripts/fetch-guardias-leon.mjs

      - name: Resumen de resultados
        if: always()
        run: |
          echo "Madrid:     ${{ steps.madrid.outcome }}"
          echo "Bizkaia:    ${{ steps.bizkaia.outcome }}"
          echo "Gipuzkoa:   ${{ steps.gipuzkoa.outcome }}"
          echo "Araba:      ${{ steps.alava.outcome }}"
          echo "A Coruña:   ${{ steps.coruna.outcome }}"
          echo "Murcia:     ${{ steps.murcia.outcome }}"
          echo "Almería:    ${{ steps.almeria.outcome }}"
          echo "Girona:     ${{ steps.girona.outcome }}"
          echo "Tarragona:  ${{ steps.tarragona.outcome }}"
          echo "Córdoba:    ${{ steps.cordoba.outcome }}"
          echo "Cantabria:  ${{ steps.cantabria.outcome }}"
          echo "Pontevedra: ${{ steps.pontevedra.outcome }}"
          echo "Las Palmas: ${{ steps.laspalmas.outcome }}"
          echo "Alicante:   ${{ steps.alicante.outcome }}"
          echo "Cádiz:      ${{ steps.cadiz.outcome }}"
          echo "Ceuta:      ${{ steps.ceuta.outcome }}"
          echo "Valencia:   ${{ steps.valencia.outcome }}"
          echo "CLM:        ${{ steps.clm.outcome }}"
          echo "Ourense:    ${{ steps.ourense.outcome }}"
          echo "Huesca:     ${{ steps.huesca.outcome }}"
          echo "Barcelona:  ${{ steps.barcelona.outcome }}"
          echo "Baleares:   ${{ steps.baleares.outcome }}"
          echo "Navarra:    ${{ steps.navarra.outcome }}"
          echo "Castellón:  ${{ steps.castellon.outcome }}"
          echo "Asturias:   ${{ steps.asturias.outcome }}"
          echo "Rioja:      ${{ steps.rioja.outcome }}"
          echo "Cáceres:    ${{ steps.caceres.outcome }}"
          echo "Lleida:     ${{ steps.lleida.outcome }}"
          echo "Soria:      ${{ steps.soria.outcome }}"
          echo "Zamora:     ${{ steps.zamora.outcome }}"
          echo "Málaga:     ${{ steps.malaga.outcome }}"
          echo "Zaragoza:   ${{ steps.zaragoza.outcome }}"
          echo "Badajoz:    ${{ steps.badajoz.outcome }}"
          echo "Valladolid: ${{ steps.valladolid.outcome }}"
          echo "Melilla:    ${{ steps.melilla.outcome }}"
          echo "Ávila:      ${{ steps.avila.outcome }}"
          echo "Burgos:     ${{ steps.burgos.outcome }}"
          echo "Salamanca:  ${{ steps.salamanca.outcome }}"
          echo "Tenerife:   ${{ steps.tenerife.outcome }}"
          echo "Teruel:     ${{ steps.teruel.outcome }}"
          echo "Segovia:    ${{ steps.segovia.outcome }}"
          echo "Granada:    ${{ steps.granada.outcome }}"
          echo "Palencia:   ${{ steps.palencia.outcome }}"
          echo "Huelva:     ${{ steps.huelva.outcome }}"
          echo "Jaén:       ${{ steps.jaen.outcome }}"
          echo "Sevilla:    ${{ steps.sevilla.outcome }}"
          echo "León:       ${{ steps.leon.outcome }}"

      - name: Crear identidad temporal del robot
        id: data-token
        if: always()
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - name: Publicar datos mediante PR validado
        id: commit
        if: always()
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
        run: |
          git add public/data/guardias-madrid.json public/data/guardias-bizkaia.json public/data/guardias-gipuzkoa.json public/data/guardias-alava.json public/data/guardias-coruna.json public/data/guardias-murcia.json public/data/guardias-almeria.json public/data/guardias-girona.json public/data/guardias-tarragona.json public/data/guardias-cordoba.json public/data/guardias-cantabria.json public/data/guardias-pontevedra.json public/data/guardias-laspalmas.json public/data/guardias-alicante.json public/data/guardias-cadiz.json public/data/guardias-ceuta.json public/data/guardias-valencia.json public/data/guardias-clm.json public/data/guardias-ourense.json public/data/guardias-huesca.json public/data/guardias-barcelona.json public/data/guardias-baleares.json public/data/guardias-navarra.json public/data/guardias-castellon.json public/data/guardias-asturias.json public/data/guardias-rioja.json public/data/guardias-caceres.json public/data/guardias-lleida.json public/data/guardias-soria.json public/data/guardias-zamora.json public/data/guardias-malaga.json public/data/guardias-zaragoza.json public/data/guardias-badajoz.json public/data/guardias-valladolid.json public/data/guardias-melilla.json public/data/guardias-avila.json public/data/guardias-burgos.json public/data/guardias-salamanca.json public/data/guardias-tenerife.json public/data/guardias-teruel.json public/data/guardias-segovia.json public/data/guardias-granada.json public/data/guardias-palencia.json public/data/guardias-huelva.json public/data/guardias-jaen.json public/data/guardias-sevilla.json public/data/guardias-leon.json
          node scripts/publish-data.mjs guardias

      # Avisa por Telegram si algun territorio no se refresco en este pase (su
      # scraper fallo). Best-effort: continue-on-error para no bloquear nunca el
      # deploy. Reutiliza el bot de "gasolineras error monitor".
      # Ver scripts/guardias-monitor.mjs.
      - name: Avisar de guardias sin refrescar (Telegram)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/guardias-monitor.mjs

      # Si TODOS fallan, que el job se marque como failed para que el monitor
      # de GHA lo detecte. Si al menos uno hizo commit, job OK.
      - name: Fallar si todos los scrapers fallaron
        if: |
          (inputs.solo_avila && steps.avila.outcome == 'failure') ||
          (inputs.solo_almeria && steps.almeria.outcome == 'failure') ||
          (inputs.solo_valencia_tenerife && (steps.valencia.outcome == 'failure' || steps.tenerife.outcome == 'failure')) || (
          steps.madrid.outcome == 'failure' &&
          steps.bizkaia.outcome == 'failure' &&
          steps.gipuzkoa.outcome == 'failure' &&
          steps.alava.outcome == 'failure' &&
          steps.coruna.outcome == 'failure' &&
          steps.murcia.outcome == 'failure' &&
          steps.almeria.outcome == 'failure' &&
          steps.girona.outcome == 'failure' &&
          steps.tarragona.outcome == 'failure' &&
          steps.cordoba.outcome == 'failure' &&
          steps.cantabria.outcome == 'failure' &&
          steps.pontevedra.outcome == 'failure' &&
          steps.laspalmas.outcome == 'failure' &&
          steps.alicante.outcome == 'failure' &&
          steps.cadiz.outcome == 'failure' &&
          steps.ceuta.outcome == 'failure' &&
          steps.valencia.outcome == 'failure' &&
          steps.clm.outcome == 'failure' &&
          steps.ourense.outcome == 'failure' &&
          steps.huesca.outcome == 'failure' &&
          steps.barcelona.outcome == 'failure' &&
          steps.baleares.outcome == 'failure' &&
          steps.navarra.outcome == 'failure' &&
          steps.castellon.outcome == 'failure' &&
          steps.asturias.outcome == 'failure' &&
          steps.rioja.outcome == 'failure' &&
          steps.caceres.outcome == 'failure' &&
          steps.lleida.outcome == 'failure' &&
          steps.soria.outcome == 'failure' &&
          steps.zamora.outcome == 'failure' &&
          steps.malaga.outcome == 'failure' &&
          steps.zaragoza.outcome == 'failure' &&
          steps.badajoz.outcome == 'failure' &&
          steps.valladolid.outcome == 'failure' &&
          steps.melilla.outcome == 'failure' &&
          steps.avila.outcome == 'failure' &&
          steps.burgos.outcome == 'failure' &&
          steps.salamanca.outcome == 'failure' &&
          steps.tenerife.outcome == 'failure' &&
          steps.teruel.outcome == 'failure' &&
          steps.segovia.outcome == 'failure' &&
          steps.granada.outcome == 'failure' &&
          steps.palencia.outcome == 'failure' &&
          steps.huelva.outcome == 'failure' &&
          steps.jaen.outcome == 'failure' &&
          steps.sevilla.outcome == 'failure' &&
          steps.leon.outcome == 'failure')
        run: |
          echo "::error::Fallaron todas las fuentes seleccionadas. Revisar los logs."
          exit 1

# La publicación se realiza exclusivamente mediante CI → Deploy.
