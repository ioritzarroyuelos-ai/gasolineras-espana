name: Fetch estaciones de ITV

# Revisa semanalmente DGT, registro nacional de Industria y datos abiertos GVA.
# Cada fuente conserva su copia anterior y su fecha si falla.

on:
  schedule:
    - cron: '0 4 * * 1'   # lunes, 04:00 UTC
  workflow_dispatch:

concurrency:
  group: fetch-itv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar lectores de datos oficiales
        run: npm ci --omit=dev --ignore-scripts

      - name: Descargar estaciones de ITV
        run: node scripts/fetch-itv.mjs

      - name: Crear identidad temporal del robot
        id: data-token
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - name: Publicar datos mediante PR validado
        id: commit
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
        run: |
          git add public/data/itv.json public/data/itv-fuentes
          node scripts/publish-data.mjs itv
