name: Fetch estaciones de ITV

# Revisa cada día DGT, registro nacional de Industria y datos abiertos GVA.
# Cada fuente conserva su copia anterior y su fecha si falla.

on:
  schedule:
    - cron: '17 4 * * *'   # diario, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: fetch-itv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar lectores de datos oficiales
        run: npm ci --omit=dev --ignore-scripts

      - name: Descargar estaciones de ITV
        id: directorio
        continue-on-error: true
        run: node scripts/fetch-itv.mjs

      - name: Comprobar los documentos oficiales de tarifas
        id: tarifas
        continue-on-error: true
        run: node scripts/check-itv-tarifas.mjs

      - name: Crear identidad temporal del robot
        id: data-token
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - name: Publicar datos mediante PR validado
        id: commit
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
        run: |
          git add public/data/itv.json public/data/itv-fuentes public/data/itv-tarifas-estado.json
          node scripts/publish-data.mjs itv

      - name: Señalar fuentes pendientes después de publicar su aviso
        if: always() && (steps.tarifas.outcome == 'failure' || steps.directorio.outcome == 'failure')
        run: exit 1
