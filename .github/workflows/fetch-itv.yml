name: Fetch estaciones de ITV

# Mensual, no diario: al contrario que los precios o las guardias, la red de
# estaciones de ITV es practicamente estatica — abren o cierran unas pocas al
# año. Rastrear esto a diario solo gastaria cuota sin aportar nada.
#
# Fuentes (ver scripts/fetch-itv.mjs):
#   - FeatureServer publico de la DGT, sin API key.
#   - Portal de datos abiertos de la GVA, solo para las 3 fijas de Castellon,
#     que la DGT no incluye.

on:
  schedule:
    - cron: '0 4 1 * *'   # dia 1 de cada mes, 04:00 UTC
  workflow_dispatch:

concurrency:
  group: fetch-itv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Descargar estaciones de ITV
        run: node scripts/fetch-itv.mjs

      - name: Publicar datos mediante PR validado
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add public/data/itv.json
          node scripts/publish-data.mjs itv
