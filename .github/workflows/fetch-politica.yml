name: Fetch political polls

on:
  schedule:
    # 04:20 UTC (06:20 Madrid). Diario: los sondeos salen varios por semana; no
    # hace falta más. La frescura la vigila además error-monitor.yml (cada 8 h).
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy a Pages aunque no cambien los datos'
        type: boolean
        default: false

concurrency:
  group: fetch-politica
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Baja los artículos de Wikipedia, parsea, valida y escribe los JSON. Ante
      # fallo por elección conserva el último bueno; solo sale !=0 si TODAS fallan.
      - name: Generar datos de política
        run: node scripts/fetch-politica.mjs

      - name: Crear identidad temporal del robot
        id: data-token
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - name: Publicar datos mediante PR validado
        id: commit
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
        run: |
          git add public/data/politica
          node scripts/publish-data.mjs politica

      # Aviso inmediato al bot de Telegram si el robot tuvo fallos. if: always()
      # para que corra aunque falle el paso anterior; continue-on-error solo aquí
      # (el envío no debe convertir un fallo del robot en éxito del job).
      - name: Avisar por Telegram (política)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/politica-monitor.mjs

# La publicación se realiza exclusivamente mediante CI → Deploy.
