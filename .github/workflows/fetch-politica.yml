name: Fetch political polls

on:
  schedule:
    # 04:20 UTC (06:20 Madrid). Diario: los sondeos salen varios por semana; no
    # hace falta más. La frescura la vigila además error-monitor.yml (cada 8 h).
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy a Pages aunque no cambien los datos'
        type: boolean
        default: false

concurrency:
  group: fetch-politica
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Baja los artículos de Wikipedia, parsea, valida y escribe los JSON. Ante
      # fallo por elección conserva el último bueno; solo sale !=0 si TODAS fallan.
      - name: Generar datos de política
        run: node scripts/fetch-politica.mjs

      - name: Commit datos si hay cambios
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/politica
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos de política"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): actualizar sondeos de política $(date -u +%Y-%m-%dT%H:%MZ)"
            # Otro robot (precios, guardias, ITV) puede pushear a la vez: fusiona lo
            # remoto quedándonos con NUESTROS ficheros de política si hay conflicto
            # y reintenta. Mismo patrón que fetch-prices.yml.
            pushed=0
            for i in 1 2 3; do
              git fetch origin main || true
              if git merge -X ours --no-edit origin/main && git push; then pushed=1; break; fi
              echo "push intento $i falló; reintento en 5s"
              git merge --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "::error::no se pudo pushear los datos de política tras 3 intentos"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Aviso inmediato al bot de Telegram si el robot tuvo fallos. if: always()
      # para que corra aunque falle el paso anterior; continue-on-error solo aquí
      # (el envío no debe convertir un fallo del robot en éxito del job).
      - name: Avisar por Telegram (política)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/politica-monitor.mjs

  # ---- Auto-deploy a Cloudflare Pages ----
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verificar que los secrets existen
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN no configurado. Los datos están en el repo pero no llegarán a prod hasta un deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        if: steps.secrets.outputs.present == 'true'
        run: npm ci

      - name: Build bundle (incluye los datos frescos)
        if: steps.secrets.outputs.present == 'true'
        run: npm run build

      - name: Deploy a Cloudflare Pages
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=webapp \
            --branch=main \
            --commit-dirty=true \
            --commit-message="auto-deploy: sondeos de política $(date -u +%Y-%m-%dT%H:%MZ)"
