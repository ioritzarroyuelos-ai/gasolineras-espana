name: Fetch fuel prices snapshot

on:
  schedule:
    # 07:00 y 19:00 UTC = 08:00 y 20:00 Madrid (invierno) / 09:00 y 21:00 (verano)
    - cron: '0 7,19 * * *'
    # Dead-man (12h): chequea que el ultimo commit de snapshot no sea demasiado
    # viejo. Es barato y nos avisa antes de que /api/health devuelva 503.
    - cron: '30 */12 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-prices
  cancel-in-progress: false

# Actions pineadas a versiones Node 24: checkout@v5 y setup-node@v5. El deploy
# usa `npx wrangler` directamente (no hay dependencia con wrangler-action).

jobs:
  fetch:
    # El job "fetch" real solo corre en los cron de 07/19. El dead-man no lo
    # dispara (seria duplicado de los dos fetchs principales).
    if: github.event.schedule != '30 */12 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 'changed' lo expone el step de commit: "true" si hubo cambios reales en
    # el snapshot, "false" si el Ministerio devolvio lo mismo que ya teniamos.
    # Solo desplegamos cuando cambia (evita crear deploys duplicados en Pages).
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch snapshot del Ministerio
        run: node scripts/fetch-prices.mjs

      # Apunta los precios de hoy en el historico estatico (public/data/history:
      # series por gasolinera, mediana provincial y media nacional). Es lo que
      # permite que las graficas, la portada y el observatorio no toquen D1, cuyo
      # cupo gratuito de lecturas (5 M/dia) se agoto el 3 de septiembre de 2026.
      # Si falla, se restauran los ficheros anteriores y la foto de precios se
      # sube igual: el Worker pedira a D1 solo el dia que falte.
      - name: Actualizar historico estatico
        run: |
          set +e
          node scripts/actualiza-historico-estatico.mjs
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::warning::actualiza-historico-estatico fallo (exit $RC): se restaura public/data/history y se sube solo la foto."
            git checkout -- public/data/history
          fi

      - name: Crear identidad temporal del robot
        id: data-token
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      - name: Publicar datos mediante PR validado
        id: commit
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
        run: |
          git add public/data/stations.json public/data/municipios.json public/data/snapshot-meta.json public/data/observatorio.json public/data/gasolineras-resumen.json public/data/history
          node scripts/publish-data.mjs prices

  dead-man:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Verificar frescura del snapshot
        run: |
          LAST=$(git log -1 --format=%ct -- public/data/snapshot-meta.json || echo 0)
          NOW=$(date +%s)
          AGE=$(( NOW - LAST ))
          MAX=$(( 26 * 3600 ))
          echo "Ultimo commit snapshot: $(date -u -d @$LAST -Iseconds 2>/dev/null || echo '?')"
          echo "Edad: ${AGE}s (maximo: ${MAX}s)"
          if [ "$LAST" = "0" ]; then
            echo "::error::No hay commits del snapshot en la historia."
            exit 1
          fi
          if [ "$AGE" -gt "$MAX" ]; then
            echo "::error::Snapshot sin actualizar en >26h. El fetch del Ministerio esta fallando."
            exit 1
          fi
          echo "Snapshot fresco. OK."

# La publicación se realiza exclusivamente mediante CI → Deploy.
