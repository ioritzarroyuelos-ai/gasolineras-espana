name: Gen tiempo municipios

# Regenera public/data/tiempo/municipios.json desde el maestro de AEMET.
# Revisión diaria a las08:07UTC mediante el reloj autenticado.
# Usa el secreto AEMET_API_KEY y publica mediante PR y comprobaciones obligatorias.

on:
  workflow_dispatch:

concurrency:
  group: gen-tiempo-municipios
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generar municipios.json
        id: maestro
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: node scripts/gen-tiempo-municipios.mjs
      - name: Crear identidad temporal del robot
        id: data-token
        uses: ./.github/actions/data-token
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
      - name: Publicar datos tras las comprobaciones
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
        run: |
          git add public/data/tiempo/municipios.json public/data/tiempo/municipios-estado.json
          node scripts/publish-data.mjs municipios
      - name: Mantener el reintento si no se pudo comprobar el maestro
        if: steps.maestro.outcome != 'success'
        run: |
          echo 'Se conserva el catálogo válido. El reloj reintentará la comprobación de AEMET.'
          exit 1
