name: Diagnóstico temporal de conexiones ITV
on:
  push:
    branches: [fix/itv-conexiones-oficiales]
    paths: [.github/workflows/itv-diagnostico.yml]
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Probar canales públicos sin modificar datos
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { lookup } from 'node:dns/promises';
          const urls = ['https://www.itvasa.es/citas/', 'https://www.itvasa.com/index.php', 'https://itvasturias.es/consejos.php', 'https://itvbooking.com/asturias.html'];
          const detalle = e => ({name:e.name, message:e.message, code:e.code, cause:e.cause ? detalle(e.cause) : undefined, errors:e.errors?.map(detalle)});
          for (const url of urls) {
            const inicio = Date.now();
            try {
              const dns = await lookup(new URL(url).hostname,{all:true});
              console.log(JSON.stringify({url,dns}));
              const res = await fetch(url,{signal:AbortSignal.timeout(25000)});
              const html = await res.text();
              console.log(JSON.stringify({url,final:res.url,status:res.status,ms:Date.now()-inicio,bytes:html.length,title:html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.trim()}));
            } catch (e) { console.log(JSON.stringify({url,ms:Date.now()-inicio,error:detalle(e)})); }
          }
          JS
