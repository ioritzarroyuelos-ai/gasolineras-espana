name: Diagnóstico temporal de conexiones ITV
on:
  push:
    branches: [fix/itv-conexiones-oficiales]
    paths: [.github/workflows/itv-diagnostico.yml]
permissions:
  contents: read
jobs:
  diagnostico:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Probar canales públicos sin modificar datos
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import net from 'node:net';
          import https from 'node:https';
          const detalle = e => ({name:e.name, message:e.message, code:e.code, cause:e.cause ? detalle(e.cause) : undefined});
          const tcp=await new Promise(resolve=>{const start=Date.now();const socket=net.connect({host:'www.itvasa.es',port:443});socket.setTimeout(12000);socket.once('connect',()=>{socket.destroy();resolve({tcp:true,ms:Date.now()-start});});socket.once('timeout',()=>{socket.destroy();resolve({tcp:false,timeout:true});});socket.once('error',e=>resolve({tcp:false,error:detalle(e)}));});
          console.log(JSON.stringify(tcp));
          for (const url of ['https://www.itvasa.es/citas/','https://itvasa.es/citas/']) {
            const start=Date.now();
            try {const res=await fetch(url,{signal:AbortSignal.timeout(16000)});const html=await res.text();console.log(JSON.stringify({url,status:res.status,ms:Date.now()-start,form:/id=["']Datos/i.test(html),title:html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.trim()}));}
            catch(e){console.log(JSON.stringify({url,ms:Date.now()-start,error:detalle(e)}));}
          }
          const tls12=await new Promise(resolve=>{
            const start=Date.now();const req=https.get('https://www.itvasa.es/citas/',{minVersion:'TLSv1.2',maxVersion:'TLSv1.2',rejectUnauthorized:true,signal:AbortSignal.timeout(16000)},res=>{
              let html='';res.on('data',c=>{html+=c;if(html.length>300000)req.destroy(Error('too large'));});res.on('end',()=>resolve({tls12:true,status:res.statusCode,ms:Date.now()-start,form:/id=["']Datos/i.test(html)}));});
            req.on('error',e=>resolve({tls12:false,ms:Date.now()-start,error:detalle(e)}));
          });
          console.log(JSON.stringify(tls12));
          JS

