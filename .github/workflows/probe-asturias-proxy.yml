name: Probe asturias proxy (temporal)

# TEMPORAL: comprueba si el egress de Cloudflare (Worker) llega a
# farmasturias.org, que bloquea las IPs de GitHub Actions. Llama al proxy
# /api/guardias/source-proxy con la URL del listado de guardia de Asturias y
# reporta el código HTTP, el tamaño y si el HTML trae farmacias.
#   - HTTP 200 + ~190 KB + "Farmacia" presente  -> el egress de CF SÍ llega
#     -> merece la pena enrutar el scraper de asturias por el proxy.
#   - 502 upstream_fetch_failed/upstream_status  -> CF también está bloqueado
#     -> no es viable; se retira el proxy.
# RETIRAR (borrar este fichero) tras tomar la decisión.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-asturias-proxy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar el proxy contra farmasturias.org
        env:
          CRON_TOKEN:    ${{ secrets.CRON_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::CRON_TOKEN secret no configurado — abortando."
            exit 1
          fi
          ORIGIN="${PUBLIC_ORIGIN:-https://webapp-3ft.pages.dev}"
          TARGET="https://www.farmasturias.org/GESCOF/cms/Guardias/FarmaciaBuscar.asp?IdMenu=355"
          ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$TARGET")
          echo "Proxy: ${ORIGIN}/api/guardias/source-proxy?url=${ENC}"
          # No usamos -f: queremos ver el body de un 502 (diagnóstico).
          CODE=$(curl -sS --max-time 60 -o /tmp/ast.html -w "%{http_code}" \
            "${ORIGIN}/api/guardias/source-proxy?url=${ENC}" \
            -H "Authorization: Bearer $CRON_TOKEN" || echo "000")
          SIZE=$(wc -c < /tmp/ast.html | tr -d ' ')
          FARM=$(grep -oiE "Farmacia" /tmp/ast.html | wc -l | tr -d ' ')
          echo "PROBE-AST-PROXY http=$CODE bytes=$SIZE farmaciaHits=$FARM"
          echo "--- primeros 300 bytes ---"
          head -c 300 /tmp/ast.html; echo
          if [ "$CODE" = "200" ] && [ "$FARM" -gt "10" ]; then
            echo "RESULT=OK — el egress de Cloudflare llega a farmasturias.org"
          else
            echo "RESULT=FAIL — Cloudflare también bloqueado o fuente caída (ver body arriba)"
          fi
