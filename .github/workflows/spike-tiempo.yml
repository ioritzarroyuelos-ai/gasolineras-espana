name: Spike tiempo (temporal)

# TEMPORAL (Tarea 1 del plan del tiempo). Ejecuta scripts/spike-tiempo.mjs con el
# secreto AEMET_API_KEY para capturar muestras reales de AEMET/Open-Meteo y subirlas
# como artifact. NO escribe en el repo. Se borra (workflow + script) en la Tarea 12.
#
# Lanzar a mano: gh workflow run spike-tiempo.yml ; luego gh run download <id>.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Capturar muestras
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: node scripts/spike-tiempo.mjs
      - name: Subir fixtures como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiempo-fixtures
          path: tests/fixtures/tiempo/
          if-no-files-found: error
