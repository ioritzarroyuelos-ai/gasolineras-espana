name: Verificar descarga del archivo histórico
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-fuel-history.yml'
      - 'scripts/check-fuel-history.mjs'
      - 'scripts/actualiza-historico-estatico.mjs'
      - 'scripts/lib/historico-estatico.*'
      - 'scripts/lib/historico-descarga.*'
permissions:
  contents: read
concurrency:
  group: verify-fuel-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  archivo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Leer una captura y medir conexión y descarga por separado
        run: node scripts/check-fuel-history.mjs
      - name: Conservar el informe incluso si falla la fuente
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostico-archivo-historico
          path: .tmp/historico-verificacion/informe.json
          retention-days: 7
