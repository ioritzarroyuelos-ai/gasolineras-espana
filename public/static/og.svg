<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="CercaYa - info útil de España al instante">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#052e1b"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1"    stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.22" r="0.55">
      <stop offset="0"   stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- icono en circulo -->
  <g transform="translate(80 180)">
    <rect width="180" height="180" rx="40" fill="url(#badge)"/>
    <g fill="#ffffff" transform="translate(32 32) scale(1.8)">
      <rect x="14" y="16" width="22" height="32" rx="3"/>
      <rect x="17" y="19" width="16" height="10" rx="1.5" fill="#14532d"/>
      <circle cx="21" cy="24" r="1.4" fill="#86efac"/>
      <rect x="18" y="34" width="14" height="2.2" rx="1" fill="#bbf7d0"/>
      <rect x="18" y="38" width="10" height="2.2" rx="1" fill="#bbf7d0"/>
      <path d="M36 22 Q44 22 44 30 L44 42 Q44 48 50 48 L50 44 Q46 44 46 42 L46 30 Q46 20 36 20 Z"/>
    </g>
  </g>

  <!-- tipografia (Liberation Sans se bundlea en gen-icons.mjs; sin emojis) -->
  <g font-family="'Liberation Sans', 'DejaVu Sans', sans-serif" fill="#ffffff">
    <text x="300" y="240" font-size="92" font-weight="800" letter-spacing="-2">CercaYa</text>
    <text x="300" y="310" font-size="38" font-weight="500" fill="#bbf7d0">Info útil de España, al instante</text>

    <!-- chips de las verticales -->
    <g transform="translate(300 360)" font-size="26" font-weight="600">
      <g>
        <rect x="0"   y="0" width="180" height="56" rx="28" fill="#ffffff" fill-opacity="0.12" stroke="#86efac" stroke-opacity="0.35"/>
        <text x="90"  y="37" text-anchor="middle" fill="#ecfdf5">El tiempo</text>
      </g>
      <g transform="translate(200 0)">
        <rect x="0"   y="0" width="210" height="56" rx="28" fill="#ffffff" fill-opacity="0.12" stroke="#86efac" stroke-opacity="0.35"/>
        <text x="105" y="37" text-anchor="middle" fill="#ecfdf5">Gasolineras</text>
      </g>
      <g transform="translate(430 0)">
        <rect x="0"   y="0" width="180" height="56" rx="28" fill="#ffffff" fill-opacity="0.12" stroke="#86efac" stroke-opacity="0.35"/>
        <text x="90"  y="37" text-anchor="middle" fill="#ecfdf5">Farmacias</text>
      </g>
      <g transform="translate(630 0)">
        <rect x="0"   y="0" width="100" height="56" rx="28" fill="#ffffff" fill-opacity="0.12" stroke="#86efac" stroke-opacity="0.35"/>
        <text x="50"  y="37" text-anchor="middle" fill="#ecfdf5">ITV</text>
      </g>
    </g>

    <!-- footer -->
    <text x="300" y="500" font-size="22" font-weight="400" fill="#86efac" opacity="0.85">Tiempo · Gasolineras · Farmacias · ITV</text>
    <text x="300" y="535" font-size="20" font-weight="400" fill="#86efac" opacity="0.6">Datos oficiales de fuentes públicas</text>
  </g>
</svg>
